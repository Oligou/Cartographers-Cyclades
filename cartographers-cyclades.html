<script>
const INFO_HTML = {
    en:
        '<h4>What this is</h4>' +
        '<p>This is a fan-made expansion for <em>Cartographers</em>, inspired by Greek mythology and the islands of the Cyclades. It adds two independent modules — <strong>Cyclades</strong> and <strong>Zeus</strong> — that can be used separately or together. It also works as a general <strong>map generator</strong> for the base game and for the Nebblis map.</p>' +
        '<h4>Cyclades expansion</h4>' +
        '<p><strong>Islands &amp; borders.</strong> In this expansion, start by drawing the borders of the Cyclades islands onto your sheet. Each island is defined by a mountain (each island has exactly one mountain). These borders mean two spaces separated by one of these borders are no longer considered adjacent. Shape placement is never affected by these borders — only adjacency for scoring.</p>' +
        '<p><strong>Edicts.</strong> This expansion also comes with its own edict rules, listed under the Edicts tab. Use as many of them as you like in a game — start with one or two — and fill the rest of your edicts by drawing randomly from the base game (once drawn, set those aside and follow the physical card). Note that some base game edict rules aren\'t adapted for the Cyclades expansion.</p>' +
        '<h4>Zeus expansion</h4>' +
        '<p><strong>Lightning.</strong> Add the three white cards from the base game into the main deck. Each time a white card is drawn, tap the lightning icon: Zeus strikes the drawn space, destroying it just like lava.</p>' +
        '<ul>' +
        '<li>Lightning can never strike a mountain.</li>' +

function shuffleArray(arr){
    const out = [...arr];
    for(let i=out.length-1;i>0;i--){
        const j = Math.floor(rand()*(i+1));
        [out[i],out[j]] = [out[j],out[i]];
    }
    return out;
}

function generateRules(){
    const shuffledTypes = shuffleArray(RULE_TYPES);
    currentRules = shuffledTypes.map((type, i)=>({
        letter:String.fromCharCode(65+i),
        type,
        ruleIndex:Math.floor(rand()*RULE_POOL.en[type].length),
        state:0
    }));
    currentRuleIndex = Math.floor(rand()*currentRules.length);
    currentSeason = 0;
    drawRules();
}

function toggleRuleCollapse(i){
    if(!currentRules[i]) return;
    currentRules[i].state = (currentRules[i].state + 1) % 2;
    drawRules();
}

function drawRules(){
    const box = document.getElementById("rulesText");
    const seeCard = UI_TEXT[currentLang].seeEdictCard;
    const seasonIcon = SEASON_ICONS[currentSeason];
    const seasonName = UI_TEXT[currentLang][SEASON_LABEL_KEYS[currentSeason]];
    const seasonTurns = SEASON_TURN_COUNTS[currentSeason];
    const seasonAria = UI_TEXT[currentLang].seasonAria;
    const highlighted = SEASON_HIGHLIGHTS[currentSeason];
    const seasonBtn = '<button type="button" class="season-btn" onclick="toggleSeason()" aria-label="' + escapeHtml(seasonAria) + '">' +
        '<span class="season-btn-icon">' + seasonIcon + '</span>' +
        '<span class="season-btn-label">' + escapeHtml(seasonName) + '</span>' +
        '<span class="season-btn-timer">(' + seasonTurns + ')</span>' +
    '</button>';
    box.innerHTML = seasonBtn + '<ul class="rules-list">' +
        currentRules.map((item, i) => {
            const state = item.state || 0;
            const ruleText = RULE_POOL[currentLang][item.type][item.ruleIndex];
            let body = "";
            if(state === 0) body = '<span class="rule-copy">' + escapeHtml(ruleText) + '</span>';
            else if(state === 1) body = '<span class="rule-copy rule-copy-hint">' + escapeHtml(seeCard) + '</span>';
            const isHighlighted = highlighted.includes(i);
            return '<li class="rule-item' + (isHighlighted ? ' season-highlight' : '') + '" onclick="toggleRuleCollapse(' + i + ')">' +
                '<span class="rule-letter">' + item.letter + '.</span>' +
                '<span class="rule-type">' + item.type + '</span>' +
                body +
            '</li>';
        }).join("") +
        '</ul>';
}

function setViewMode(mode){
    if(mode === "rules" && !cycladesMode) return;
    currentViewMode = mode;
    const isRules = mode === "rules";
    document.getElementById("mapTab").classList.toggle("active", !isRules);
    document.getElementById("rulesTab").classList.toggle("active", isRules);
    document.getElementById("mapTab").setAttribute("aria-selected", String(!isRules));
    document.getElementById("rulesTab").setAttribute("aria-selected", String(isRules));
    document.getElementById("rulesText").hidden = !isRules;
    document.getElementById("canvas").style.display = isRules ? "none" : "block";
    document.getElementById("canvas").hidden = isRules;
    document.getElementById("mapWrap").hidden = isRules;
    updateLegendVisibility();
    // The canvas cannot be measured while it is hidden, so its display box is
    // stale whenever the grid or the viewport changed on the edicts tab.
    if(!isRules) applyCanvasDisplaySize();
}

function wrapMixedWords(ctx, words, maxWidth){
    const lines = [];
    let line = [];
    let lineWidth = 0;
    for(const w of words){
        ctx.font = w.font;
        const wordWidth = ctx.measureText(w.text + " ").width;
        if(line.length && lineWidth + wordWidth > maxWidth){
            lines.push(line);
            line = [];
            lineWidth = 0;
        }
        line.push(w);
        lineWidth += wordWidth;
    }
    if(line.length) lines.push(line);
    return lines;
}

async function printMapAndRules(){
    if(!currentGrid) return;
    const FONT = "'Marcellus', 'Trebuchet MS', Arial, sans-serif";
    const boldRuleFont = "bold 19px " + FONT;
    const normalRuleFont = "19px " + FONT;
    const hintRuleFont = "italic 19px " + FONT;
    try{
        await Promise.all([
            document.fonts.load("23px 'Marcellus'"),
            document.fonts.load("19px 'Marcellus'"),
            document.fonts.load("bold 19px 'Marcellus'"),
            document.fonts.load("italic 19px 'Marcellus'"),
            document.fonts.load("bold 13px 'Marcellus'"),
            document.fonts.load("24px 'Special Elite'")
        ]);
    }catch(e){   }
    const mapW = canvas.width;
    const mapH = canvas.height;
    const pad = 24;
    const titleH = 50;
    const titleMapGap = 14;
    const mapRulesGap = 56;
    const lineH = 30;
    const ruleGap = 12;
    const labelFont = "20px " + FONT;
    const rowLabelW = 34;
    const colLabelH = 34;
    const cellW = mapW / GRID_COLS;
    const cellH = mapH / GRID_ROWS;
    const mapX = pad + rowLabelW;
    const textMaxWidth = mapW - pad*2;
    const seeCard = UI_TEXT[currentLang].seeEdictCard;

    const measure = document.createElement("canvas").getContext("2d");
    const ruleBlocks = cycladesMode ? currentRules.map(item => {
        const state = item.state || 0;
        const words = [
            { text: item.letter + ".", font: boldRuleFont },
            { text: item.type + " —", font: boldRuleFont }
        ];
        if(state === 0){
            const ruleText = RULE_POOL[currentLang][item.type][item.ruleIndex];
            words.push(...ruleText.split(" ").map(w => ({ text: w, font: normalRuleFont })));
        } else if(state === 1){
            words.push(...seeCard.split(" ").map(w => ({ text: w, font: hintRuleFont })));
        }
        return { lines: wrapMixedWords(measure, words, textMaxWidth) };
    }) : [];

    let rulesHeight = 0;
    if(cycladesMode){
        rulesHeight = mapRulesGap;
        ruleBlocks.forEach(b => { rulesHeight += b.lines.length*lineH + ruleGap; });
    }

    const includeCoordList = randomMapMode;
    let coordBlocks = [];
    let coordHeight = 0;
    if(includeCoordList){
        const {mountains, temples, volcano, wastelands} = sortedCoords(currentMapConfig);
        coordBlocks = [
            "⛰️ " + mountains.join(" - "),
            "🏛️ " + temples.join(" - ")
        ];
        if(volcano) coordBlocks.push("🌋 " + volcano);
        if(wastelands) coordBlocks.push("🪨 " + wastelands);
        coordBlocks = coordBlocks.map(text => ({ lines: wrapMixedWords(measure, text.split(" ").map(w => ({ text: w, font: normalRuleFont })), textMaxWidth) }));
        coordHeight = mapRulesGap;
        coordBlocks.forEach(b => { coordHeight += b.lines.length*lineH + ruleGap; });
    }

    const totalW = mapW + pad*2 + rowLabelW;
    const totalH = titleH + titleMapGap + mapH + colLabelH + rulesHeight + coordHeight + pad*2;

    const out = document.createElement("canvas");
    out.width = totalW;
    out.height = totalH;
    const octx = out.getContext("2d");

    octx.fillStyle = "#fdfaf3";
    octx.fillRect(0, 0, totalW, totalH);

    const codeText = randomSeedInput.value.trim();
    const titleWord = UI_TEXT[currentLang].mapTitleWord;
    const MONO_FONT = "'Special Elite', 'Courier New', monospace";
    octx.fillStyle = "#0d3b66";
    octx.textAlign = "left";
    if(codeText){
        const wordFont = "bold 23px " + FONT;
        const codeFont = "24px " + MONO_FONT;
        const sep = " · ";
        octx.font = wordFont;
        const wordW = octx.measureText(titleWord).width;
        octx.font = "23px " + FONT;
        const sepW = octx.measureText(sep).width;
        octx.font = codeFont;
        const codeW = octx.measureText(codeText).width;
        const totalTitleW = wordW + sepW + codeW;
        let x = totalW/2 - totalTitleW/2;
        const y = pad + 26;
        octx.font = wordFont;
        octx.fillText(titleWord, x, y);
        x += wordW;
        octx.font = "23px " + FONT;
        octx.fillText(sep, x, y);
        x += sepW;
        octx.font = codeFont;
        octx.fillText(codeText, x, y);
    } else {
        octx.font = "bold 23px " + FONT;
        octx.textAlign = "center";
        octx.fillText(titleWord, totalW/2, pad + 26);
    }

    draw(currentGrid, currentSeeds, currentIslands, currentN, currentMapConfig, currentBlocked, new Set());
    const mapY = titleH + titleMapGap;
    octx.drawImage(canvas, mapX, mapY);
    draw(currentGrid, currentSeeds, currentIslands, currentN, currentMapConfig, currentBlocked, struckCells);

    octx.strokeStyle = "#0d3b66";
    octx.lineWidth = 3;
    octx.strokeRect(mapX + 1.5, mapY + 1.5, mapW - 3, mapH - 3);

    octx.font = labelFont;
    octx.fillStyle = "#0d3b66";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    for(let r=0;r<GRID_ROWS;r++){
        octx.fillText(String.fromCharCode(65+r), mapX - rowLabelW/2, mapY + r*cellH + cellH/2);
    }
    for(let c=0;c<GRID_COLS;c++){
        octx.fillText(String(c+1), mapX + c*cellW + cellW/2, mapY + mapH + colLabelH/2);
    }
    octx.textBaseline = "alphabetic";

    let y = titleH + titleMapGap + mapH + colLabelH + mapRulesGap;
    octx.textAlign = "left";

    coordBlocks.forEach(b => {
        b.lines.forEach(line => {
            let x = mapX;
            line.forEach(w => {
                octx.font = w.font;
                octx.fillStyle = "#0d3b66";
                const withSpace = w.text + " ";
                octx.fillText(withSpace, x, y);
                x += octx.measureText(withSpace).width;
            });
            y += lineH;
        });
        y += ruleGap;
    });

    if(ruleBlocks.length && coordBlocks.length){
        y += mapRulesGap - ruleGap;
    }

    ruleBlocks.forEach(b => {
        b.lines.forEach(line => {
            let x = mapX;
            line.forEach(w => {
                octx.font = w.font;
                octx.fillStyle = w.font === boldRuleFont ? "#0d3b66" : "#222";
                const withSpace = w.text + " ";
                octx.fillText(withSpace, x, y);
                x += octx.measureText(withSpace).width;
            });
            y += lineH;
        });
        y += ruleGap;
    });

    document.getElementById("saveOverlayImg").src = out.toDataURL("image/png");
    document.getElementById("saveOverlay").classList.add("active");
}

const WASTELAND_MIN = 0;
const WASTELAND_STEP = 1;
let wastelandCount = 0;
// The share code stores the wasteland count in a fixed-width field, so the UI
// must not accept a value the code cannot carry back.
function clampWastelands(n){
    return Math.min(RANDOM_WASTELAND_MAX, Math.max(WASTELAND_MIN, n));
}
function adjustWasteland(delta){
    wastelandCount = clampWastelands(wastelandCount + delta*WASTELAND_STEP);
    updateMapControls();
    generate();
}

function randomSeedValue(){ return Math.floor(Math.random()*195112); }

const BASE58_ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function toBase58(num){
    if(num === 0) return BASE58_ALPHABET[0];
    let s = "";
    let n = Math.floor(num);
    while(n > 0){
        s = BASE58_ALPHABET[n % 58] + s;
        n = Math.floor(n / 58);
    }
    return s;
}
function fromBase58(str){
    if(!str) return NaN;
    let n = 0;
    for(const ch of str){
        const idx = BASE58_ALPHABET.indexOf(ch);
        if(idx === -1) return NaN;
        n = n * 58 + idx;
    }
    return n;
}

function toBase58Padded(num, length){
    let s = toBase58(num);
    while(s.length < length) s = BASE58_ALPHABET[0] + s;
    return s;
}

function toBijectiveBase58(num){
    let n = Math.floor(num);
    if(n <= 0) return "";
    let s = "";
    while(n > 0){
        n -= 1;
        s = BASE58_ALPHABET[n % 58] + s;
        n = Math.floor(n / 58);
    }
    return s;
}
function fromBijectiveBase58(str){
    if(!str) return 0;
    let n = 0;
    for(const ch of str){
        const idx = BASE58_ALPHABET.indexOf(ch);
        if(idx === -1) return NaN;
        n = n * 58 + (idx + 1);
    }
    return n;
}

const RANDOM_DIM_SPAN = GRID_DIM_MAX - GRID_DIM_MIN + 1;
const RANDOM_FEATURE_SPAN = FEATURE_COUNT_MAX - FEATURE_COUNT_MIN + 1;
const RANDOM_WASTELAND_MAX = 127;
const RANDOM_WASTELAND_SPAN = RANDOM_WASTELAND_MAX + 1;
const RANDOM_ROW_DEFAULT = 11;
const RANDOM_COL_DEFAULT = 11;
const RANDOM_MOUNTAINS_DEFAULT = 5;
const MOUNTAIN_WASTELAND_ADJ_WEIGHT = 60;
const RANDOM_TEMPLES_DEFAULT = 6;
const TEMPLE_BORDER_WEIGHT = 4;

function toDefaultOffset(value, defaultValue, span){
    return (((value - defaultValue) % span) + span) % span;
}
function fromDefaultOffset(offset, defaultValue, span){
    return (((offset + defaultValue) % span) + span) % span;
}

function buildMapConfigSegment(){
    if(randomMapMode){
        const wc = clampWastelands(wastelandCount);
        const mountains = Math.min(FEATURE_COUNT_MAX, Math.max(FEATURE_COUNT_MIN, lastRandomMountains));
        const temples = Math.min(FEATURE_COUNT_MAX, Math.max(FEATURE_COUNT_MIN, lastRandomTemples));
        const cols = Math.min(GRID_DIM_MAX, Math.max(GRID_DIM_MIN, lastRandomCols));
        const rows = Math.min(GRID_DIM_MAX, Math.max(GRID_DIM_MIN, lastRandomRows));

        const rowOffset = toDefaultOffset(rows, RANDOM_ROW_DEFAULT, RANDOM_DIM_SPAN);
        const colOffset = toDefaultOffset(cols, RANDOM_COL_DEFAULT, RANDOM_DIM_SPAN);
        const mountainsOffset = toDefaultOffset(mountains, RANDOM_MOUNTAINS_DEFAULT, RANDOM_FEATURE_SPAN);
        const templesOffset = toDefaultOffset(temples, RANDOM_TEMPLES_DEFAULT, RANDOM_FEATURE_SPAN);

        let n = rowOffset;
        n = n*RANDOM_DIM_SPAN + colOffset;
        n = n*RANDOM_FEATURE_SPAN + mountainsOffset;
        n = n*RANDOM_FEATURE_SPAN + templesOffset;
        n = n*RANDOM_WASTELAND_SPAN + wc;
        return (volcanoEnabled ? "n" : "r") + toBijectiveBase58(n);
    }
    return PRESET_CODE_BY_KEY[lastManualMapValue] || lastManualMapValue;
}

function buildShareCode(){
    const mapStr = buildMapConfigSegment();
    const seedVal = Math.abs(Math.floor(randomSeed || 1)) % 195112;
    const seedStr = toBase58Padded(seedVal, 3);
    return mapStr + "-" + seedStr + (cycladesMode ? "*" : "");
}

function applyShareCode(code){
    let str = String(code).trim();
    const cyclades = str.endsWith("*");
    if(cyclades) str = str.slice(0, -1);

    const dashIdx = str.indexOf("-");
    const mapStr = dashIdx === -1 ? str : str.slice(0, dashIdx);
    const presetCodes = Object.keys(PRESET_KEY_BY_CODE);
    const isPreset = presetCodes.includes(mapStr);
    const isDefaultRandomCode = mapStr === "Z";
    const isNewRandomCode = mapStr.length > 0 && (mapStr[0] === "r" || mapStr[0] === "n");

    if(dashIdx === -1 && !isPreset && !isDefaultRandomCode && !isNewRandomCode){
        randomSeed = null;
        generate();
        return;
    }

    let seedVal = null;
    if(dashIdx !== -1){
        const seedStr = str.slice(dashIdx + 1);
        seedVal = fromBase58(seedStr);
        if(!Number.isFinite(seedVal) || seedVal < 0){
            randomSeed = null;
            generate();
            return;
        }
    }

    cycladesMode = cyclades;

    if(isPreset){
        randomMapMode = false;
        lastManualMapValue = PRESET_KEY_BY_CODE[mapStr];
    } else if(isDefaultRandomCode){
        randomMapMode = true;
        lastRandomCols = 11;
        lastRandomRows = 11;
        lastRandomMountains = 5;
        lastRandomTemples = 6;
        wastelandCount = WASTELAND_DEFAULT;
        volcanoEnabled = false;
    } else if(isNewRandomCode){
        const n0 = fromBijectiveBase58(mapStr.slice(1));
        if(!Number.isFinite(n0) || n0 < 0){
            randomMapMode = false;
            lastManualMapValue = PRESET_KEY_BY_CODE[presetCodes[0]];
        } else {
            randomMapMode = true;
            volcanoEnabled = mapStr[0] === "n";
            let n = n0;
            const wc = n % RANDOM_WASTELAND_SPAN; n = Math.floor(n/RANDOM_WASTELAND_SPAN);
            const templesOffset = n % RANDOM_FEATURE_SPAN; n = Math.floor(n/RANDOM_FEATURE_SPAN);
            const mountainsOffset = n % RANDOM_FEATURE_SPAN; n = Math.floor(n/RANDOM_FEATURE_SPAN);
            const colOffset = n % RANDOM_DIM_SPAN; n = Math.floor(n/RANDOM_DIM_SPAN);
            const rowOffset = n;

            wastelandCount = clampWastelands(wc);
            lastRandomMountains = fromDefaultOffset(mountainsOffset, RANDOM_MOUNTAINS_DEFAULT, RANDOM_FEATURE_SPAN);
            lastRandomTemples = fromDefaultOffset(templesOffset, RANDOM_TEMPLES_DEFAULT, RANDOM_FEATURE_SPAN);
            lastRandomCols = GRID_DIM_MIN + fromDefaultOffset(colOffset, RANDOM_COL_DEFAULT - GRID_DIM_MIN, RANDOM_DIM_SPAN);
            lastRandomRows = GRID_DIM_MIN + fromDefaultOffset(rowOffset, RANDOM_ROW_DEFAULT - GRID_DIM_MIN, RANDOM_DIM_SPAN);
        }
    } else {
        const n0 = fromBase58(mapStr);
        if(!Number.isFinite(n0) || n0 < 0){
            randomMapMode = false;
            lastManualMapValue = PRESET_KEY_BY_CODE[presetCodes[0]];
        } else {
            randomMapMode = true;
            let n = n0;
            const volcano = n % 2; n = Math.floor(n/2);
            const slotB = n % 7; n = Math.floor(n/7);
            const slotA = n % 7; n = Math.floor(n/7);
            const temples = n % 10; n = Math.floor(n/10);
            const mountains = n % 10; n = Math.floor(n/10);
            const wc = n;

            volcanoEnabled = !!volcano;
            wastelandCount = clampWastelands(wc);
            lastRandomMountains = Math.min(FEATURE_COUNT_MAX, mountains);
            lastRandomTemples = Math.min(FEATURE_COUNT_MAX, temples);
            lastRandomCols = GRID_DIM_MIN + Math.min(slotA, GRID_DIM_MAX-GRID_DIM_MIN);
            lastRandomRows = GRID_DIM_MIN + Math.min(slotB, GRID_DIM_MAX-GRID_DIM_MIN);
        }
    }

    randomSeed = (seedVal != null ? seedVal : randomSeedValue()) || 1;

    document.getElementById("randomMapToggle").checked = randomMapMode;
    document.getElementById("cycladesToggle").checked = cycladesMode;

    generate();
}

function buildAdjacency(grid,n,blockedSet){
    let adj = [];
    for(let i=0;i<n;i++) adj.push(new Set());
    for(let y=0;y<GRID_ROWS;y++){
        for(let x=0;x<GRID_COLS;x++){
            if(blockedSet.has(cellKey(x,y))) continue;
            const r = grid[y][x];
            if(r===-1) continue;
            if(x<GRID_COLS-1 && !blockedSet.has(cellKey(x+1,y)) && grid[y][x+1]!==-1 && grid[y][x+1]!==r){
                adj[r].add(grid[y][x+1]);
                adj[grid[y][x+1]].add(r);
            }
            if(y<GRID_ROWS-1 && !blockedSet.has(cellKey(x,y+1)) && grid[y+1][x]!==-1 && grid[y+1][x]!==r){
                adj[r].add(grid[y+1][x]);
                adj[grid[y+1][x]].add(r);
            }
        }
    }
    return adj;
}

function fourColorRegions(adj,n){
    const order = [...Array(n).keys()].sort((a,b)=>adj[b].size-adj[a].size);
    const colorOf = Array(n).fill(-1);

    function backtrack(k){
        if(k===n) return true;
        const region = order[k];
        for(let c=0;c<4;c++){
            let conflict=false;
            for(const neighbor of adj[region]){
                if(colorOf[neighbor]===c){ conflict=true; break; }
            }
            if(!conflict){
                colorOf[region]=c;
                if(backtrack(k+1)) return true;
                colorOf[region]=-1;
            }
        }
        return false;
    }
    backtrack(0);
    return colorOf;
}

function randomIslands(n){
    const shuffledNames = shuffleArray(CYCLADES_NAMES);
    let islands=[];
    for(let i=0;i<n;i++){
        const name = shuffledNames[i];
        islands.push({
            name: name,
            lore_en: CYCLADES_LORE[name],
            lore_fr: CYCLADES_LORE_FR[name]
        });
    }
    return islands;
}

function computeIslandMeta(mapConfig, grid, blockedSet){
    const N = mapConfig.mountains.length;
    const islands = randomIslands(N);
    const adjacency = buildAdjacency(grid, N, blockedSet);
    const colorIndices = fourColorRegions(adjacency, N);
    for(let i=0;i<N;i++){
        islands[i].color = FOUR_COLOR_PALETTE[colorIndices[i]];
    }
    return islands;
}

function applyCanvasDisplaySize(){
    const prevWidth = canvas.style.width;
    const prevHeight = canvas.style.height;
    canvas.style.width = "";
    canvas.style.height = "";
    const target = canvas.getBoundingClientRect().width;
    if(!target || !GRID_COLS || !GRID_ROWS){
        canvas.style.width = prevWidth;
        canvas.style.height = prevHeight;
        return;
    }
    const longerCount = Math.max(GRID_COLS, GRID_ROWS);
    const scale = target / longerCount;
    canvas.style.width = (GRID_COLS * scale) + "px";
    canvas.style.height = (GRID_ROWS * scale) + "px";
    document.getElementById("colLabels").style.width = canvas.getBoundingClientRect().width + "px";
}

function neighbours(x,y){
    let out=[];
    if(x>0) out.push([x-1,y]);
    if(x<GRID_COLS-1) out.push([x+1,y]);
    if(y>0) out.push([x,y-1]);
    if(y<GRID_ROWS-1) out.push([x,y+1]);
    return out;
}

function growIslands(seedPositions, blockedSet, targetAssigned){
    const N = seedPositions.length;

    let grid=[];
    for(let y=0;y<GRID_ROWS;y++)
        grid[y]=Array(GRID_COLS).fill(-1);

    let frontiers=[];
    let seeds=[];

    for(let i=0;i<N;i++){
        let x=seedPositions[i][0];
        let y=seedPositions[i][1];
        grid[y][x]=i;
        seeds.push({x,y});
        frontiers[i]=[];
        for(let n of neighbours(x,y)){
            const [nx,ny]=n;
            if(!blockedSet.has(cellKey(nx,ny))) frontiers[i].push(n);
        }
    }

    let assigned=N;

    while(assigned<targetAssigned){

        let active=[];
        for(let i=0;i<N;i++)
            if(frontiers[i].length>0)
                active.push(i);

        if(active.length===0) break;

        let region=
            active[Math.floor(rand()*active.length)];

        let index=
            Math.floor(rand()*frontiers[region].length);

        let [x,y]=frontiers[region].splice(index,1)[0];

        if(grid[y][x]!=-1)
            continue;

        grid[y][x]=region;
        assigned++;

        for(let n of neighbours(x,y)){
            let [nx,ny]=n;
            if(grid[ny][nx]==-1 && !blockedSet.has(cellKey(nx,ny)))
                frontiers[region].push(n);
        }
    }

    return {grid, seeds};
}

function isBorderCell(x,y){
    return x===0 || x===GRID_COLS-1 || y===0 || y===GRID_ROWS-1;
}

const GIBBS_ITERATIONS_PER_ITEM = 25;
const SPACING_WEIGHT = 2;

function manhattan(a, b){
    return Math.abs(a[0]-b[0]) + Math.abs(a[1]-b[1]);
}

function gibbsEnergy(c, others, minDist, extraEnergyFn){
    let eSpacing = 0;
    for(const o of others){
        const d = manhattan(c, o);
        if(d < minDist){
            const violation = minDist - d;
            eSpacing += violation * violation;
        }
    }

    const eExtra = extraEnergyFn ? extraEnergyFn(c, others) : 0;

    return SPACING_WEIGHT * eSpacing + eExtra;
}

function gibbsSampleOne(candidates, others, minDist, extraEnergyFn){
    const energies = candidates.map(c => gibbsEnergy(c, others, minDist, extraEnergyFn));
    const minE = Math.min(...energies);
    const weights = energies.map(e => Math.exp(-(e - minE)));
    const total = weights.reduce((a,b) => a+b, 0);

    let r = rand() * total;
    for(let i=0;i<candidates.length;i++){
        r -= weights[i];
        if(r <= 0) return candidates[i];
    }
    return candidates[candidates.length-1];
}

function pickSpacedCells(candidates, count, minDist, extraEnergyFn){
    if(candidates.length===0 || count<=0) return [];

    const pool = candidates.map(p => [p[0], p[1]]);
    if(pool.length < count){
        return pool.slice(0, count);
    }

    const shuffled = pool.slice();
    for(let i=shuffled.length-1;i>0;i--){
        const j = Math.floor(rand()*(i+1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const positions = shuffled.slice(0, count);

    for(let sweep=0; sweep<GIBBS_ITERATIONS_PER_ITEM; sweep++){
        for(let i=0;i<count;i++){
            const others = positions.filter((_,idx) => idx!==i);
            const occupied = new Set(others.map(o => cellKey(o[0], o[1])));
            const freeCandidates = pool.filter(p => !occupied.has(cellKey(p[0], p[1])));

            positions[i] = gibbsSampleOne(freeCandidates, others, minDist, extraEnergyFn);
        }
    }

    return positions;
}

const WASTELAND_EPSILON = 0.02;

function pickWastelandCells(wastelandCount, excludeSet){
    const usedSet = new Set(excludeSet || []);
    const pool = [];
    for(let y=0;y<GRID_ROWS;y++)
        for(let x=0;x<GRID_COLS;x++)
            if(!usedSet.has(cellKey(x,y))) pool.push([x,y]);

    if(pool.length===0 || wastelandCount<=0) return new Set();

    const placedSet = new Set();

    for(let i=0; i<wastelandCount; i++){
        const free = pool.filter(p => !placedSet.has(cellKey(p[0], p[1])));
        if(free.length===0) break;

        const weights = free.map(([x,y]) => {
            const touchesPlaced = neighbours(x,y).some(([nx,ny]) => placedSet.has(cellKey(nx,ny)));
            return touchesPlaced ? 1 : WASTELAND_EPSILON;
        });
        const totalWeight = weights.reduce((s,w) => s+w, 0);

        let r = rand() * totalWeight;
        let cell = free[free.length-1];
        for(let j=0; j<free.length; j++){
            r -= weights[j];
            if(r <= 0){ cell = free[j]; break; }
        }

        placedSet.add(cellKey(cell[0], cell[1]));
    }

    return placedSet;
}

function carveVolcano(){
    let candidates = [];
    for(let y=0;y<GRID_ROWS-1;y++)
        for(let x=0;x<GRID_COLS-1;x++)
            candidates.push([x,y]);
    if(candidates.length===0) return new Set();
    const [x,y] = candidates[Math.floor(rand()*candidates.length)];
    return new Set([cellKey(x,y), cellKey(x+1,y), cellKey(x,y+1), cellKey(x+1,y+1)]);
}

function buildRandomMap(rawConfig, wastelandCount, volcanoEnabled){
    let allCells=[];
    for(let y=0;y<GRID_ROWS;y++)
        for(let x=0;x<GRID_COLS;x++)
            allCells.push([x,y]);

    const volcanoSet = volcanoEnabled ? carveVolcano() : new Set();

    const volcanoBuffer = new Set(volcanoSet);
    for(const k of volcanoSet){
        const [vx,vy] = k.split(",").map(Number);
        for(const [nx,ny] of neighbours(vx,vy)) volcanoBuffer.add(cellKey(nx,ny));
    }
    const wastelandSet = pickWastelandCells(wastelandCount, volcanoBuffer);
    const blockedSet = new Set([...volcanoSet, ...wastelandSet]);

    const mountainCandidates = allCells.filter(([x,y]) => {
        const k = cellKey(x,y);
        if(blockedSet.has(k)) return false;
        if(isBorderCell(x,y)) return false;
        if(neighbours(x,y).some(([nx,ny]) => volcanoSet.has(cellKey(nx,ny)))) return false;
        for(const vk of volcanoSet){
            const [vx,vy] = vk.split(",").map(Number);
            if(Math.abs(x-vx) + Math.abs(y-vy) < 3) return false;
        }
        return true;
    });
    const wastelandAdjacencyEnergy = ([x,y]) => {
        const adjacentWastelandCount = neighbours(x,y).filter(([nx,ny]) => wastelandSet.has(cellKey(nx,ny))).length;
        return MOUNTAIN_WASTELAND_ADJ_WEIGHT * adjacentWastelandCount;
    };
    const seedPositions = pickSpacedCells(mountainCandidates, rawConfig.numMountains, rawConfig.mountainMinDist, wastelandAdjacencyEnergy);
    const mountainSet = new Set(seedPositions.map(([x,y])=>cellKey(x,y)));

    let grid, seeds;
    if(cycladesMode){
        const grown = growIslands(seedPositions, blockedSet, GRID_ROWS*GRID_COLS - blockedSet.size);
        grid = grown.grid; seeds = grown.seeds;
    } else {
        grid = [];
        for(let y=0;y<GRID_ROWS;y++){
            grid[y] = [];
            for(let x=0;x<GRID_COLS;x++) grid[y][x] = 0;
        }
        seeds = seedPositions.map(([x,y])=>({x,y}));
    }

    const mountains = seedPositions.map(([x,y])=>formatCoord(x,y));

    const templeCandidates = allCells.filter(([x,y]) => {
        const k = cellKey(x,y);
        if(mountainSet.has(k) || blockedSet.has(k)) return false;
        if(cycladesMode && grid[y][x]===-1) return false;
        return true;
    });
    const templeBorderEnergy = (c, others) => {
        if(!isBorderCell(c[0], c[1])) return 0;
        const otherBorderCount = others.filter(o => isBorderCell(o[0], o[1])).length;
        return TEMPLE_BORDER_WEIGHT * otherBorderCount;
    };
    const temples = pickSpacedCells(templeCandidates, rawConfig.numTemples, rawConfig.templeMinDist, templeBorderEnergy)
        .map(([x,y])=>formatCoord(x,y));

    const blocked = [...blockedSet].map(k=>{
        const [x,y] = k.split(",").map(Number);
        return formatCoord(x,y);
    });
    const volcano = [...volcanoSet].map(k=>{
        const [x,y] = k.split(",").map(Number);
        return formatCoord(x,y);
    });

    const mapConfig = {
        mountains,
        temples,
        blocked,
        volcano,
        gridCols: GRID_COLS,
        gridRows: GRID_ROWS
    };

    return {mapConfig, grid, seeds};
}

function generate(){

    if(randomSeed===null) setRandomSeed(randomSeedValue());
    else setRandomSeed(randomSeed);

    updateMapControls();
    const rawConfig = activeRawConfig();

    GRID_COLS = rawConfig.gridCols || 11;
    GRID_ROWS = rawConfig.gridRows || 11;
    updateGridLabels();
    canvas.width = GRID_COLS * CELL;
    canvas.height = GRID_ROWS * CELL;
    applyCanvasDisplaySize();

    let mapConfig, grid, seeds, blockedSet;

    if(rawConfig.random){
        const built = buildRandomMap(rawConfig, wastelandCount, volcanoEnabled);
        mapConfig = built.mapConfig;
        grid = built.grid;
        seeds = built.seeds;
        blockedSet = new Set(
            mapConfig.blocked.map(c=>{ const p=parseCoord(c); return cellKey(p.x,p.y); })
        );
    } else {
        // Copy the preset: currentMapConfig outlives this call, and a mutation
        // through it would corrupt MAPS for the rest of the session.
        mapConfig = {
            ...rawConfig,
            mountains:[...rawConfig.mountains],
            temples:[...rawConfig.temples],
            blocked:[...rawConfig.blocked],
            volcano:[...rawConfig.volcano]
        };
        blockedSet = new Set(
            mapConfig.blocked.map(c=>{ const p=parseCoord(c); return cellKey(p.x,p.y); })
        );
        if(cycladesMode){
            const seedPositions = mapConfig.mountains.map(coord=>{
                const p = parseCoord(coord);
                return [p.x, p.y];
            });
            const built = growIslands(seedPositions, blockedSet, GRID_ROWS*GRID_COLS - blockedSet.size);
            grid = built.grid;
            seeds = built.seeds;
        } else {
            grid = [];
            for(let y=0;y<GRID_ROWS;y++){
                grid[y] = [];
                for(let x=0;x<GRID_COLS;x++) grid[y][x] = 0;
            }
            seeds = mapConfig.mountains.map(coord=>{ const p = parseCoord(coord); return {x:p.x, y:p.y}; });
        }
    }

    currentBlocked = blockedSet;

    const N = mapConfig.mountains.length;
    const islands = cycladesMode ? computeIslandMeta(mapConfig, grid, blockedSet) : [];

    generateRules();

    zeusSequence = precomputeZeusSequence(mapConfig, grid, blockedSet);
    zeusIndex = 0;
    struckCells = new Set();
    lastStrikeKey = null;
    lastStrikeStoryIndex = null;
    zeusResting = false;
    drawZeusResult();

    draw(grid,seeds,islands,N,mapConfig,blockedSet,struckCells);
    currentIslands = islands;
    currentGrid = grid;
    currentMapConfig = mapConfig;
    currentSeeds = seeds;
    currentN = N;
    resetIslandInfo();
    updateEdictTabAvailability();
    drawRules();
}

function precomputeZeusSequence(mapConfig, grid, blockedSet){
    const mountainKeys = new Set(
        mapConfig.mountains.map(c=>{ const p=parseCoord(c); return cellKey(p.x,p.y); })
    );
    const usedRows = new Set();
    const usedCols = new Set();
    const sequence = [];

    let storyPool = [];
    function nextStoryIndex(){
        if(storyPool.length === 0){
            storyPool = ZEUS_STORIES.en.map((_, i) => i);
            for(let i = storyPool.length - 1; i > 0; i--){
                const j = Math.floor(rand() * (i + 1));
                [storyPool[i], storyPool[j]] = [storyPool[j], storyPool[i]];
            }
        }
        return storyPool.pop();
    }

    while(true){
        let candidates = [];
        for(let y=0;y<GRID_ROWS;y++){
            if(usedRows.has(y)) continue;
            for(let x=0;x<GRID_COLS;x++){
                if(usedCols.has(x)) continue;
                const k = cellKey(x,y);
                if(blockedSet.has(k)) continue;
                if(mountainKeys.has(k)) continue;
                if(cycladesMode && grid[y][x]===-1) continue;
                candidates.push(k);
            }
        }
        if(candidates.length===0) break;

        const pick = candidates[Math.floor(rand()*candidates.length)];
        const [px,py] = pick.split(",").map(Number);
        usedRows.add(py);
        usedCols.add(px);

        const storyIndex = nextStoryIndex();
        sequence.push({key:pick, storyIndex});
    }
    return sequence;
}

function drawZeus(){
    if(!currentGrid || !currentMapConfig) return;
    if(zeusIndex >= zeusSequence.length){
        zeusResting = true;
        drawZeusResult();
        showZeusResting();
        return;
    }

    const {key, storyIndex} = zeusSequence[zeusIndex];
    zeusIndex++;
    struckCells.add(key);
    lastStrikeKey = key;
    lastStrikeStoryIndex = storyIndex;
    drawZeusResult();

    showZeusStory(storyIndex);

    draw(currentGrid, currentSeeds, currentIslands, currentN, currentMapConfig, currentBlocked, struckCells);
}

function drawZeusResult(){
    const el = document.getElementById("zeusResult");
    document.getElementById("zeusResetBtn").style.display = (struckCells.size > 0 || zeusResting) ? "flex" : "none";
    if(zeusResting){
        el.textContent = UI_TEXT[currentLang].zeusResting;
        el.classList.add("clickable");
        el.setAttribute("role", "button");
        el.setAttribute("tabindex", "0");
        el.onclick = () => showZeusResting();
        el.onkeydown = (e) => {
            if(e.key === "Enter" || e.key === " "){
                e.preventDefault();
                showZeusResting();
            }
        };
        return;
    }
    if(!lastStrikeKey){
        el.textContent = "";
        el.classList.remove("clickable");
        el.onclick = null;
        el.removeAttribute("role");
        el.removeAttribute("tabindex");
        el.onkeydown = null;
        return;
    }
    const [sx,sy] = lastStrikeKey.split(",").map(Number);
    el.textContent = UI_TEXT[currentLang].lastStrike + " " + formatCoord(sx,sy);
    el.classList.add("clickable");
    el.setAttribute("role", "button");
    el.setAttribute("tabindex", "0");
    el.onclick = () => showZeusStory(lastStrikeStoryIndex);
    el.onkeydown = (e) => {
        if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            showZeusStory(lastStrikeStoryIndex);
        }
    };
}

function resetZeus(){
    if(!currentGrid) return;
    zeusIndex = 0;
    struckCells = new Set();
    lastStrikeKey = null;
    lastStrikeStoryIndex = null;
    zeusResting = false;
    drawZeusResult();
    resetIslandInfo();
    draw(currentGrid, currentSeeds, currentIslands, currentN, currentMapConfig, currentBlocked, struckCells);
}

function fillEmojiCentered(text, cx, cy, size){
    ctx.font = size + "px Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    const m = ctx.measureText(text);
    const left = m.actualBoundingBoxLeft;
    const right = m.actualBoundingBoxRight;
    const asc = m.actualBoundingBoxAscent;
    const desc = m.actualBoundingBoxDescent;
    let x, y;
    if(left != null && right != null && asc != null && desc != null && (left || right)){
        x = cx - (right - left) / 2;
        y = cy + (asc - desc) / 2;
    } else {
        x = cx - m.width / 2;
        y = cy + size * 0.35;
    }
    ctx.fillText(text, x, y);
}

function draw(grid,seeds,islands,N,mapConfig,blockedSet,struckCells){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const volcanoSet = new Set(
        (mapConfig.volcano || []).map(c=>{ const p = parseCoord(c); return cellKey(p.x,p.y); })
    );

    for(let y=0;y<GRID_ROWS;y++){
        for(let x=0;x<GRID_COLS;x++){
            const px = x*CELL;
            const py = y*CELL;
            if(blockedSet.has(cellKey(x,y))){
                if(volcanoSet.has(cellKey(x,y))){
                    ctx.fillStyle="#8A3220";
                } else {
                    ctx.fillStyle="#8c8c8c";
                }
                ctx.fillRect(px,py,CELL,CELL);
                continue;
            }
            if(cycladesMode && grid[y][x]===-1){
                ctx.fillStyle="#8c8c8c";
                ctx.fillRect(px,py,CELL,CELL);
                continue;
            }
            const isMountainCell = mapConfig.mountains.some(coord=>{
                const p = parseCoord(coord);
                return p.x===x && p.y===y;
            });
            ctx.fillStyle = cycladesMode
                ? islands[grid[y][x]].color
                : (isMountainCell ? "#555555" : SINGLE_ISLAND_COLOR);
            ctx.fillRect(px,py,CELL,CELL);
        }
    }

    ctx.globalAlpha=0.06;
    grainRandomState = (Math.abs(Math.floor(randomSeed)) || 1)>>>0;
    for(let y=0;y<GRID_ROWS;y++){
        for(let x=0;x<GRID_COLS;x++){
            if(blockedSet.has(cellKey(x,y))) continue;
            ctx.fillStyle="#000";
            for(let k=0;k<4;k++){
                ctx.fillRect(
                    x*CELL+grainRandom()*CELL,
                    y*CELL+grainRandom()*CELL,
                    1.6,1.6
                );
            }
        }
    }
    ctx.globalAlpha=1;

    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.setLineDash([4,4]);
    ctx.strokeStyle="#0d3b66";
    ctx.lineWidth=1;
    for(let x=0;x<=GRID_COLS;x++){
        ctx.beginPath();
        ctx.moveTo(x*CELL,0);
        ctx.lineTo(x*CELL,GRID_ROWS*CELL);
        ctx.stroke();
    }
    for(let y=0;y<=GRID_ROWS;y++){
        ctx.beginPath();
        ctx.moveTo(0,y*CELL);
        ctx.lineTo(GRID_COLS*CELL,y*CELL);
        ctx.stroke();
    }
    ctx.restore();

    for(const coord of mapConfig.mountains){
        const p = parseCoord(coord);
        const my = cycladesMode ? p.y*CELL + CELL*0.32 : p.y*CELL + CELL/2;
        fillEmojiCentered("⛰️", p.x*CELL + CELL/2, my, CELL*0.55);
    }
    for(const coord of mapConfig.temples){
        const p = parseCoord(coord);
        if(cycladesMode && grid[p.y][p.x]===-1) continue;
        fillEmojiCentered("🏛️", p.x*CELL + CELL/2, p.y*CELL + CELL/2, CELL*0.55);
    }

    function regionOf(x,y){
        if(volcanoSet.has(cellKey(x,y))) return -4;
        if(blockedSet.has(cellKey(x,y))) return -2;
        if(cycladesMode && grid[y][x]===-1) return -2;
        return cycladesMode ? grid[y][x] : -3;
    }
    ctx.strokeStyle="#0d3b66";
    ctx.lineWidth=4;
    for(let y=0;y<GRID_ROWS;y++){
        for(let x=0;x<GRID_COLS;x++){
            const r = regionOf(x,y);
            const left = x*CELL;
            const top = y*CELL;

            if(x<GRID_COLS-1 && regionOf(x+1,y)!=r){
                ctx.beginPath();
                ctx.moveTo(left+CELL,top);
                ctx.lineTo(left+CELL,top+CELL);
                ctx.stroke();
            }
            if(y<GRID_ROWS-1 && regionOf(x,y+1)!=r){
                ctx.beginPath();
                ctx.moveTo(left,top+CELL);
                ctx.lineTo(left+CELL,top+CELL);
                ctx.stroke();
            }
        }
    }

    if(cycladesMode){
        ctx.font="bold 13px 'Marcellus', 'Trebuchet MS', Arial, sans-serif";
        ctx.textAlign="center";
        for(let i=0;i<N;i++){
            let s=seeds[i];
            const cx = s.x*CELL+CELL/2;
            const cy = s.y*CELL+CELL*0.82;

            ctx.lineWidth=3;
            ctx.strokeStyle="#fff";
            ctx.strokeText(
                islands[i].name,
                cx,
                cy
            );
            ctx.fillStyle="#08304d";
            ctx.fillText(
                islands[i].name,
                cx,
                cy
            );
        }
    }

    if(struckCells && struckCells.size>0){
        for(const k of struckCells){
            const [sx,sy] = k.split(",").map(Number);
            fillEmojiCentered("⚡️", sx*CELL+CELL/2, sy*CELL+CELL/2, CELL*0.55);
        }
    }

}

function sortedCoords(mapConfig){
    const byReadingOrder = (a,b) => {
        const pa = parseCoord(a), pb = parseCoord(b);
        return pa.y - pb.y || pa.x - pb.x;
    };
    return {
        mountains: [...mapConfig.mountains].sort(byReadingOrder),
        temples: [...mapConfig.temples].sort(byReadingOrder),
        volcano: formatVolcanoCoords(mapConfig.volcano),
        wastelands: formatWastelandCoords(mapConfig)
    };
}

function formatVolcanoCoords(volcano){
    if(!volcano || volcano.length === 0) return null;
    const points = volcano.map(parseCoord);
    const rowLetters = points.map(p => String.fromCharCode(65 + p.y));
    const colNumbers = points.map(p => p.x + 1);
    const rowMin = rowLetters.reduce((a,b) => a < b ? a : b);
    const rowMax = rowLetters.reduce((a,b) => a > b ? a : b);
    const colMin = Math.min(...colNumbers);
    const colMax = Math.max(...colNumbers);
    return rowMin + "-" + rowMax + " ∩ " + colMin + "-" + colMax;
}

function formatWastelandCoords(mapConfig){
    const volcanoSet = new Set(mapConfig.volcano || []);
    const cells = (mapConfig.blocked || []).filter(c => !volcanoSet.has(c));
    if(cells.length === 0) return null;
    const byReadingOrder = (a,b) => {
        const pa = parseCoord(a), pb = parseCoord(b);
        return pa.y - pb.y || pa.x - pb.x;
    };
    const byKey = new Map(cells.map(c => {
        const p = parseCoord(c);
        return [cellKey(p.x,p.y), c];
    }));
    const visited = new Set();
    const groups = [];
    for(const c of cells){
        const p = parseCoord(c);
        const k = cellKey(p.x,p.y);
        if(visited.has(k)) continue;
        visited.add(k);
        const stack = [[p.x,p.y]];
        const group = [c];
        while(stack.length){
            const [cx,cy] = stack.pop();
            for(const [nx,ny] of neighbours(cx,cy)){
                const nk = cellKey(nx,ny);
                if(byKey.has(nk) && !visited.has(nk)){
                    visited.add(nk);
                    group.push(byKey.get(nk));
                    stack.push([nx,ny]);
                }
            }
        }
        groups.push(group.sort(byReadingOrder));
    }
    groups.sort((a,b) => byReadingOrder(a[0], b[0]));
    return groups.map(g => g.join(" - ")).join("; ");
}

function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    // textContent -> innerHTML leaves quotes intact; drawRules puts the result
    // inside an attribute, so they have to go too.
    return div.innerHTML.replace(/"/g, "&quot;");
}

function handleCanvasTap(e){
    if(!currentGrid || !cycladesMode) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (e.clientX - rect.left) * scaleX;
    const py = (e.clientY - rect.top) * scaleY;
    const gx = Math.floor(px / CELL);
    const gy = Math.floor(py / CELL);
    if(gx < 0 || gx >= GRID_COLS || gy < 0 || gy >= GRID_ROWS) return;
    if(currentBlocked.has(cellKey(gx,gy))) return;
    const regionIndex = currentGrid[gy][gx];
    if(regionIndex == null || regionIndex < 0) return;
    showIslandInfo(currentIslands[regionIndex], regionIndex);
}

canvas.addEventListener("click", handleCanvasTap);
